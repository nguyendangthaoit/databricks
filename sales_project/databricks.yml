# This is a Declarative Automation Bundle definition for sales_project.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: sales_project
  uuid: 3ff19f23-29bb-4da8-92fa-faab8dbc3660

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-dcb68684-5e55.cloud.databricks.com
    variables:
      catalog: workspace
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://dbc-dcb68684-5e55.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/thaond10@fpt.com to make sure we only have a single copy.
      root_path: /Workspace/Users/thaond10@fpt.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: prod
    permissions:
      - user_name: thaond10@fpt.com
        level: CAN_MANAGE
